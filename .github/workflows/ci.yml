name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test
      - run: npm run db:validate
      - run: npm run build

  migration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fleet_os
          POSTGRES_PASSWORD: fleet_os_test
          POSTGRES_DB: fleet_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fleet_os -d fleet_os_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://fleet_os:fleet_os_test@localhost:5432/fleet_os_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply migrations to disposable PostgreSQL
        run: npm run db:smoke
